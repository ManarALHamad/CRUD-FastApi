<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
<link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>


</head>
<body>

    <main class="container">

        <header>

            <h1>Item Manager  </h1>

            <p>
                Vanilla JavaScript + FastAPI CRUD
            </p>

        </header>

        <section class ="card">

            <h2 id="form-title">
                Add Item
            </h2>
         
        <form id="item-form" >

            <div class="form-group">

            <label for="name">Name </label>
            <input type="text" id="name" placeholder="Enter item name" required >

                </div>

            <div class="form-group">

            <label for="description">Description </label>
          
            <textarea id="description" placeholder="Enter description" required ></textarea>
    

                </div>

               <div class="form-buttons">

                    <button type="submit" id="submit-button">Add</button>
               


                    <button type="button" id="cancel-button" class="secondary hidden">Cancel</button>
                        
               
                </div>


        </form>


        </section>


        <!-- Items display -->

        <section class="card">

            <div class="items-header">

                <h2>Items</h2>

                <button id="refresh-button" class="secondary" >Refresh</button>
        

            </div>

             <div id="message"></div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                  <tbody id="items-table-body">

                    </tbody>

                </table>



         </div>

        </section>



    </main>





      

</body>
</html>
